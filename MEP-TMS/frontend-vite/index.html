<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maverick One - The training management system (TMS)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Maverick One - The training management system (TMS)</title>
    <script>
      window.addEventListener('error', function(event) {
        fetch('http://127.0.0.1:8000/api/debug-log', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: event.message || event.error?.message || 'Unknown error',
            stack: event.error?.stack || 'No stack trace',
            url: window.location.href
          })
        }).catch(err => {});
      });
      window.addEventListener('unhandledrejection', function(event) {
        fetch('http://127.0.0.1:8000/api/debug-log', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: event.reason?.message || event.reason || 'Unhandled promise rejection',
            stack: event.reason?.stack || 'No stack trace',
            url: window.location.href
          })
        }).catch(err => {});
      });
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
    <noscript>JavaScript is required to run Maverick One.</noscript>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;">
        <p style="font-size:16px;font-weight:600;opacity:0.7;">Loading Maverick One...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
